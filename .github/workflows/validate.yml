name: Validate specifications

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Schema and semantic invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - name: Install validator
        run: python3 -m pip install --requirement tools/requirements-ci.txt
      - name: Check validator syntax
        run: python3 -m compileall -q tools
      - name: Validate register descriptions
        run: python3 tools/validate.py
